# Render Blueprint: Vercel frontend + free all-in-one API/Chroma service.
#
# Apply this file from the Render dashboard (New -> Blueprint) and fill the
# `sync: false` secrets. The container runs Chroma on loopback; no separate
# private service, disk, or Chroma auth is required.
#
# Trade-off: Render free services sleep after idle and have no persistent disk.
# The vector index is rebuilt from data/scheme_embeddings.json on each wake.

services:
  - type: web
    name: schemesaathi-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./deploy/Dockerfile.allinone
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: schemesaathi
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://schemesaathi-chi.vercel.app
      - key: TRUST_PROXY
        value: 'true'
      - key: RATE_LIMIT_MAX
        value: '60'
